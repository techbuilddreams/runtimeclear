# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# The scripts have no package dependencies; only the pinned GitHub Actions are updated.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    # Wait a week after an action is released before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
