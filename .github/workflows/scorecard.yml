name: Scorecard supply-chain security

# OpenSSF Scorecard: https://github.com/ossf/scorecard
# publish_results: true only works if this workflow passes Scorecard's verification:
# no top-level or job-level env/defaults, no containers or services, no write
# permissions at the top level, and only approved actions in the job's steps.
on:
  # Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keep the Maintained check fresh.
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish results to the OpenSSF API and enable the badge.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
