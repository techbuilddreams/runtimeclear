name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ShellCheck, encodings)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck (settings in .shellcheckrc)
        run: |
          shellcheck --version
          shellcheck runtimeclear.sh tests/run.sh

      - name: LF line endings and ASCII-only PowerShell
        run: |
          status=0
          if grep -n $'\r' runtimeclear.sh runtimeclear.ps1 tests/run.sh tests/smoke.ps1 SHA256SUMS; then
            echo "::error::CRLF line endings found (see .gitattributes)."; status=1
          fi
          # Windows PowerShell 5.1 misreads non-ASCII text in files without a BOM.
          if LC_ALL=C grep -n -P '[^\x00-\x7F]' runtimeclear.ps1 tests/smoke.ps1 PSScriptAnalyzerSettings.psd1; then
            echo "::error::Non-ASCII characters in PowerShell files."; status=1
          fi
          exit "$status"

  test-linux:
    name: Tests (Ubuntu, bash 5, pwsh parity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install strace (enables the no-network test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends strace

      - name: Tool versions
        run: |
          bash --version | head -n 1
          python3 --version
          strace -V | head -n 1
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run tests/run.sh
        run: bash tests/run.sh

  test-macos:
    name: Tests (macOS, system bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # tests/run.sh starts the scanner with `bash`, so the stock /bin/bash has to be
      # the first bash on PATH, not a newer one from Homebrew.
      - name: Put the system bash first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/system-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/system-bash/bash"
          echo "$RUNNER_TEMP/system-bash" >> "$GITHUB_PATH"

      - name: Confirm bash 3.2
        run: |
          command -v bash
          bash -c 'echo "bash $BASH_VERSION"; case "$BASH_VERSION" in 3.2.*) exit 0 ;; *) exit 1 ;; esac' ||
            { echo "::error::Expected the system bash 3.2 on PATH."; exit 1; }
          python3 --version

      - name: Run tests/run.sh with /bin/bash
        env:
          # PowerShell parity is covered by the Ubuntu and Windows jobs; this job proves bash 3.2.
          RUNTIMECLEAR_TEST_PWSH: "0"
        run: /bin/bash tests/run.sh

  powershell-windows:
    name: PowerShell (Windows, 5.1 and 7)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $required = [version]'1.25.0'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $required })) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $required -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module -Name PSScriptAnalyzer -RequiredVersion $required
          $findings = @(foreach ($file in @('runtimeclear.ps1', 'tests/smoke.ps1')) {
            Invoke-ScriptAnalyzer -Path $file -Settings ./PSScriptAnalyzerSettings.psd1
          })
          $findings | Format-Table -AutoSize -Property Severity, RuleName, ScriptName, Line, Message | Out-String -Width 4096
          if ($findings.Count -gt 0) {
            Write-Output "::error::PSScriptAnalyzer reported $($findings.Count) finding(s)."
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: no findings.'

      - name: Smoke test on Windows PowerShell 5.1
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\smoke.ps1
          exit $LASTEXITCODE

      - name: Smoke test on PowerShell 7
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests\smoke.ps1
          exit $LASTEXITCODE

  powershell-ubuntu:
    name: PowerShell 7 (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test on pwsh
        run: pwsh -NoProfile -File tests/smoke.ps1

  # Single required status check for branch protection.
  result:
    name: CI result
    if: always()
    needs: [lint, test-linux, test-macos, powershell-windows, powershell-ubuntu]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more CI jobs did not succeed."
          exit 1
      - name: All jobs passed
        run: echo "All CI jobs passed."
